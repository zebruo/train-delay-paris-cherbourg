<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>Train</title>
  <defs>
    <linearGradient id="corps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f76ac" />
      <stop offset="100%" stop-color="#24466b" />
    </linearGradient>
  </defs>

  <!-- Même dessin que train-logo.svg, "écrasé" (aplati verticalement,
       élargi horizontalement) autour du centre du train pour un rendu
       plus trapu/jouet et qui remplit mieux le cadre carré. -->
  <g transform="translate(100,109) scale(1.08,0.85) translate(-100,-109)">
    <!-- Voie -->
    <line x1="14" y1="167" x2="186" y2="167" stroke="#a9b4bd" stroke-width="7" stroke-linecap="round" />

    <!-- Pantographe -->
    <path d="M75,65 L75,44 L96,44 L96,65" fill="none" stroke="#232b33"
          stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Attelage : courte barre à l'arrière (bord plat gauche), hauteur
         tampon, sous le bandeau et au-dessus des roues. -->
    <rect x="22" y="136" width="14" height="8" rx="2" fill="#232b33" />

    <!-- Carrosserie -->
    <path d="M35,150 L35,85 Q35,65 55,65 L140,65 Q169,65 181,106 Q185,119 165,150 Z"
          fill="url(#corps)" />

    <!-- Bandeau -->
    <rect x="40" y="112" width="130" height="7" rx="3.5" fill="#e8a33d" />

    <!-- Vitres -->
    <rect x="49" y="77" width="19" height="28" rx="5" fill="#eef4f9" stroke="#1e3a56" stroke-width="2" />
    <rect x="76" y="77" width="19" height="28" rx="5" fill="#eef4f9" stroke="#1e3a56" stroke-width="2" />
    <rect x="103" y="77" width="19" height="28" rx="5" fill="#eef4f9" stroke="#1e3a56" stroke-width="2" />
    <rect x="130" y="77" width="13" height="28" rx="5" fill="#eef4f9" stroke="#1e3a56" stroke-width="2" />
  </g>

  <!-- Roues : hors du groupe écrasé, pour rester parfaitement rondes
       (repositionnées aux coordonnées déjà transformées). -->
  <circle cx="62.2" cy="143.85" r="17" fill="#232b33" />
  <circle cx="62.2" cy="143.85" r="6.5" fill="#c9d3da" />
  <circle cx="138.88" cy="143.85" r="17" fill="#232b33" />
  <circle cx="138.88" cy="143.85" r="6.5" fill="#c9d3da" />
</svg>

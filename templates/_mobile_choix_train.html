<div class="mobile-carte">
    <p class="mobile-section-titre" style="margin-top: 0;">Quel train prenez-vous habituellement ?</p>
    <label class="mobile-champ" style="margin-bottom: 10px;">
        <span class="mobile-champ-label">Gare de départ :</span>
        <select id="mobile-choix-gare-{{ mode }}" name="gare"
                hx-get="/mobile/destinations_gare" hx-target="#mobile-choix-arrivee-{{ mode }}" hx-trigger="change"
                hx-swap="innerHTML" onchange="reinitialiserApresGareDepart('{{ mode }}')">
            <option value="" selected disabled hidden>Choisissez…</option>
            {% for g in gare_options %}
                {% if g.startswith("—") %}
                    <option disabled>{{ g }}</option>
                {% else %}
                    <option value="{{ g }}">{{ g }}</option>
                {% endif %}
            {% endfor %}
        </select>
    </label>
    <label class="mobile-champ" style="margin-bottom: 10px;">
        <span class="mobile-champ-label">Gare d'arrivée :</span>
        <select id="mobile-choix-arrivee-{{ mode }}" name="destination"
                hx-get="/mobile/heures_trajet" hx-target="#mobile-choix-heure-{{ mode }}" hx-trigger="change"
                hx-include="#mobile-choix-gare-{{ mode }}, #mobile-choix-jour-{{ mode }}" hx-swap="innerHTML"
                onchange="viderCandidatsTrain('{{ mode }}')">
            <option value="" selected disabled hidden>Choisissez…</option>
        </select>
    </label>
    <label class="mobile-champ" style="margin-bottom: 10px;">
        <span class="mobile-champ-label">Jour :</span>
        <select id="mobile-choix-jour-{{ mode }}" name="jour"
                hx-get="/mobile/heures_trajet" hx-target="#mobile-choix-heure-{{ mode }}" hx-trigger="change"
                hx-include="#mobile-choix-gare-{{ mode }}, #mobile-choix-arrivee-{{ mode }}" hx-swap="innerHTML"
                onchange="viderCandidatsTrain('{{ mode }}')">
            <option value="" selected disabled hidden>Choisissez…</option>
            <option value="Lundi">Lundi</option>
            <option value="Mardi">Mardi</option>
            <option value="Mercredi">Mercredi</option>
            <option value="Jeudi">Jeudi</option>
            <option value="Vendredi">Vendredi</option>
            <option value="Samedi">Samedi</option>
            <option value="Dimanche">Dimanche</option>
        </select>
    </label>
    <label class="mobile-champ">
        <span class="mobile-champ-label">Horaire théo. :</span>
        <select id="mobile-choix-heure-{{ mode }}" name="heure"
                hx-get="/mobile/resoudre_train" hx-target="#mobile-candidats-{{ mode }}" hx-trigger="change"
                hx-include="#mobile-choix-gare-{{ mode }}, #mobile-choix-arrivee-{{ mode }}, #mobile-choix-jour-{{ mode }}"
                hx-vals='{"mode": "{{ mode }}"}'>
            <option value="" selected disabled hidden>Choisissez…</option>
        </select>
    </label>
</div>
<div id="mobile-candidats-{{ mode }}"></div>
